name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e ".[dev,gui]"
      - name: Run tests
        run: python -m pytest
      - name: Compile package
        run: python -m compileall -q kubrick
      - name: Smoke-test GUI imports
        run: python -c "from kubrick.ui.app import MainWindow; print('Kubrick GUI import OK')"
      - name: Lint
        run: ruff check .
