name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
      - name: Install FFmpeg and headless Qt runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e ".[dev,gui]"
      - name: Run tests
        run: python -m pytest
      - name: Compile package
        run: python -m compileall -q kubrick
      - name: Smoke-test desktop UI
        run: python -c "from PySide6.QtWidgets import QApplication; from kubrick.ui.app import MainWindow; app = QApplication([]); window = MainWindow(); app.processEvents(); assert getattr(window, '_kubrick_ux_installed', False); print('Kubrick desktop UI smoke test OK'); window.close(); app.quit()"
      - name: Lint
        run: ruff check .
