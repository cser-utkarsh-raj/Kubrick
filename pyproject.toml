[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubrick"
version = "0.1.0"
description = "Precision-first local video editing automation engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyside6>=6.8,<7",
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-qt>=4,<5",
  "ruff>=0.9,<1",
]

[project.scripts]
kubrick = "kubrick.app:main"

[tool.setuptools.packages.find]
include = ["kubrick*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
