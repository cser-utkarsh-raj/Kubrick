[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubrick"
version = "0.2.0"
description = "Precision-first local video editing engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
gui = ["pyside6>=6.8,<7"]
speech = ["faster-whisper>=1.2,<2"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]
all = ["pyside6>=6.8,<7", "faster-whisper>=1.2,<2", "pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
kubrick = "kubrick.cli:main"
kubrick-gui = "kubrick.ui.app:main"

[tool.setuptools.packages.find]
include = ["kubrick*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
